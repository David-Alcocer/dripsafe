# Configuración de Streamlit para el dashboard de DripSafe.

[server]
# Solo este equipo puede abrir el dashboard (como pide el kit CIFOX: no publicarlo en la red ni en internet).
address = "127.0.0.1"
# Recarga el dashboard en cuanto guardas un archivo.
runOnSave = true
# Sirve app/static/ en la ruta app/static/ (ahí viven las fuentes, para no depender de internet).
enableStaticServing = true

[browser]
# Sin estadísticas de uso: la demo debe funcionar sin internet.
gatherUsageStats = false

[client]
# Sin el botón «Deploy» ni el menú de desarrollo: en la demo solo se ve el dashboard.
toolbarMode = "minimal"

[theme]
# Paleta profesional sobria: fondo gris azulado oscuro, azul acero para los datos y alertas en tonos apagados.
base = "dark"
primaryColor = "#3f7cc4"
backgroundColor = "#0f1419"
secondaryBackgroundColor = "#161c24"
textColor = "#ccccdc"

# Tipografía: Inter para texto y títulos, JetBrains Mono para código.
# Los archivos están en app/static/fuentes/ (licencia OFL), así que funcionan sin internet.
font = "Inter, sans-serif"
headingFont = "Inter, sans-serif"
codeFont = "'JetBrains Mono', monospace"
metricValueFontWeight = 700

# Fuentes variables: un solo archivo cubre todos los pesos del rango.
[[theme.fontFaces]]
family = "Inter"
url = "app/static/fuentes/Inter-latin.woff2"
weight = "400 800"

[[theme.fontFaces]]
family = "JetBrains Mono"
url = "app/static/fuentes/JetBrainsMono-latin.woff2"
weight = "400 500"
